name: APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm test
      - run: npm run vendor
      - run: echo "window.APP_VERSION = ${{ github.run_number }};" > www/version.js
      - run: npx cap add android
      - name: Permissions + code natif (mise à jour intégrée)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in CAMERA VIBRATE REQUEST_INSTALL_PACKAGES; do
            sed -i "s#<uses-permission android:name=\"android.permission.INTERNET\" />#&\n    <uses-permission android:name=\"android.permission.$P\" />#" $M
          done
          test "$(grep -c android.permission $M)" -eq 4
          cp native/*.java android/app/src/main/java/fr/pierrick/pokescan/
      - run: npx cap sync android
      # Toujours la même clé : sinon chaque nouvelle APK refuse de s'installer par-dessus (et désinstaller efface la collection)
      - run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PokeScan.apk
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "v${{ github.run_number }}" PokeScan.apk --title "PokeScan v${{ github.run_number }}" --notes "Télécharge PokeScan.apk depuis ton téléphone et installe-la."
